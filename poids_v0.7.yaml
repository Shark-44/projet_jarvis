# ─────────────────────────────────────────────────────────────────
# poids.yaml — v0.7
# Table de vérité GEMMA
# Répond à deux questions simultanément :
#   1. Où est l'humain ?
#   2. Que fait-il ?
#
# Structure de chaque signal :
#   poids         : contribution au score (0.0 → 1.0, négatif = exclusion)
#   valeur_active : valeur attendue pour que le signal contribue
#   seuil_max     : valeur numérique ≤ seuil → contribue
#   seuil_min     : valeur numérique ≥ seuil → contribue
#
# Types de signaux :
#   primaire    : détecte la présence dans la pièce (poids élevé)
#   renforçant  : confirme l'activité (poids moyen)
#   contextuel  : affine la certitude (poids faible)
#   négatif     : exclut l'état (poids négatif)
#
# Gardes :
#   Conditions obligatoires évaluées AVANT le scoring
#   Si une garde est fausse → score = 0, on ne calcule rien
#
# Contraintes :
#   duree_min   : durée minimale en secondes pour confirmer l'état
#   duree_max   : durée maximale — au-delà c'est un autre état
#   contexte    : plage horaire requise
#
# ─────────────────────────────────────────────────────────────────
# Signaux opérationnels aujourd'hui :
#
#   LD2450 Chambre (device_map_reader + vector_engine) :
#     Presence_chambre_presence_piece     — binaire Z1 ESP32
#     Presence_chambre_sur_le_lit         — binaire Z2 ESP32
#     Presence_chambre_passage_porte      — binaire Z3 ESP32
#     Presence_chambre_immobile           — still>0 ET moving==0
#     Presence_chambre_toutes_statiques   — vector_engine
#     Presence_chambre_mouvement_local    — vector_engine
#     Presence_chambre_grands_deplacements — vector_engine
#
#   LD2450 Bureau (device_map_reader + vector_engine) :
#     Presence_bureau_presence_piece      — binaire Z1 ESP32
#     Presence_bureau_sur_cliclac         — binaire Z2 ESP32
#     Presence_bureau_passage_porte       — binaire Z3 ESP32
#     Presence_bureau_immobile            — still>0 ET moving==0
#     Presence_bureau_toutes_statiques    — vector_engine
#     Presence_bureau_mouvement_local     — vector_engine
#     Presence_bureau_grands_deplacements — vector_engine
#
#   Autres :
#     PIR              Cuisine, SDB, WC
#     Capteur_porte_entree — couloir
#     PC_HP            — bureau
#     Tele_en_lecture  — salon (bool dérivé)
#     Tele_allumee     — salon (on/off)
#     Ampli            — salon
#     Switch_chevet    — chambre
#
# Signaux à venir :
#   Alarme_programmee — réveil programmé HA (en cours)
#   FP2_Salon         — présence + zone + posture
#   FP2_Couloir       — flux + direction
#   ESP32_Salon       — ping présence active salon
#
# Prochain objectif :
#   Moteur d'attention — exploitera variance_position et kinetic_integral
#   de vector_engine pour affiner les décisions dans le temps
# ─────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────
# CONTEXTE TEMPOREL
# ─────────────────────────────────────────────
contexte:
  nuit:
    debut: 23
    fin: 6
    modificateur: 1.3

  matin:
    debut: 6
    fin: 9
    modificateur: 1.1

  journee:
    debut: 9
    fin: 20
    modificateur: 1.0

  soiree:
    debut: 20
    fin: 23
    modificateur: 1.1

# ─────────────────────────────────────────────
# SEUIL GLOBAL
# ─────────────────────────────────────────────
seuil: 0.75

# ─────────────────────────────────────────────
# ÉTATS
# ─────────────────────────────────────────────
