      Eclairage_bureau:      0
      Spot_bureau:           0
      Eclairage_Chambre:     0
      Chevet_Chambre:        0
      Eclairage_Salon_tv:    0
      Eclairage_Salon_table: 0
      Wled_Salon:            0
      Spot_Ambiance:         0
      Interrupteur Eclairage Cuisine: false
    degage_froid:
      Eclairage_bureau:      0
      Spot_bureau:           0
      Eclairage_Chambre:     0
