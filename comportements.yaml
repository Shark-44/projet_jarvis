# comportements.yaml
#
# But :
# Déterminer l'ambiance lumineuse suivant :
#   - Etat humain (sommeil, travail, TV…)
#   - Luminosité extérieure
#   - Météo (impact psychologique/confort)
#
# Principe :
# La météo seule n'allume jamais une lumière.
# C'est surtout JOUR / NUIT qui décide.
# La pluie ou ciel couvert augmente légèrement la luminosité intérieure.

conditions:

  jour_ensoleille:
    # Soleil présent + forte luminosité naturelle
    # → presque aucune lumière nécessaire
    soleil: above_horizon
    meteo: sunny

  jour_couvert:
    # Jour mais lumière extérieure réduite
    soleil: above_horizon
    meteo:
      - cloudy
      - partlycloudy

  jour_pluie:
    # Jour sombre → besoin de compensation
    soleil: above_horizon
    meteo:
      - rainy
      - pouring

  nuit:
    # Nuit = soleil sous horizon
    soleil: below_horizon


# --------------------------------------------------
# COMPORTEMENTS
# --------------------------------------------------

etats:

# ==================================================
# SOMMEIL
# ==================================================

  SOMMEIL:

    # Dormir = obscurité totale
    jour_ensoleille:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0

    jour_couvert:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0

    jour_pluie:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0

    nuit:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0

    reveil_nocturne:
      # Cas particulier :
      # déplacement WC / eau
      # éviter choc lumineux
      Chevet_Chambre: 20
      Couloir: 15


# ==================================================
# TV / FILM
# ==================================================

  REPOS_TV:

    jour_ensoleille:
      # Lumière naturelle suffisante
      Eclairage_Salon_tv: 0
      Wled_Salon: 0

    jour_couvert:
      # Compensation légère
      Eclairage_Salon_tv: 40
      Wled_Salon: 30

    jour_pluie:
      # Ambiance plus confortable
      Eclairage_Salon_tv: 60
      Wled_Salon: 50

    nuit:
      # Réduction fatigue visuelle
      Eclairage_Salon_tv: 40
      Wled_Salon: 30
      Spot_Ambiance: 20


# ==================================================
# MUSIQUE / DETENTE
# ==================================================

  REPOS_MUSIQUE:

    jour_ensoleille:
      Spot_Ambiance: 0
      Wled_Salon: 20

    jour_couvert:
      Spot_Ambiance: 50
      Wled_Salon: 70

    jour_pluie:
      # météo sombre = ambiance chaleureuse
      Spot_Ambiance: 70
      Wled_Salon: 90

    nuit:
      Spot_Ambiance: 80
      Wled_Salon: 100


# ==================================================
# REPAS / CUISINE
# ==================================================

  NUTRITIF:

    jour_ensoleille:
      Interrupteur_Cuisine: false

    jour_couvert:
      Interrupteur_Cuisine: true

    jour_pluie:
      Interrupteur_Cuisine: true

    nuit:
      Interrupteur_Cuisine: true
      Eclairage_Salon_table: 100


# ==================================================
# BUREAU / PC
# ==================================================

  ACTIF_BUREAU:

    jour_ensoleille:
      # lumière naturelle
      Eclairage_bureau: 80

    jour_couvert:
      Eclairage_bureau: 160
      Spot_bureau: 100

    jour_pluie:
      Eclairage_bureau: 200
      Spot_bureau: 140

    nuit:
      # Travail écran → lumière indirecte
      Eclairage_bureau: 180
      Spot_bureau: 120


# ==================================================
# MENAGE / ENTRETIEN
# ==================================================

  ENTRETIEN:

    default:
      # L'entretien privilégie visibilité
      Eclairage_bureau: 255
      Eclairage_Salon_tv: 255
      Eclairage_Salon_table: 255
      Spot_bureau: 255
      Interrupteur_Cuisine: true


# ==================================================
# ABSENCE
# ==================================================

  ABSENT:

    default:

      # Sécurité énergétique
      Eclairage_bureau: 0
      Eclairage_Chambre: 0
      Eclairage_Salon_tv: 0
      Wled_Salon: 0
      Cuisine: false

      # sauf simulation présence éventuelle