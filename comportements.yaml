      Eclairage_SDB: 220
    sombre:
      Eclairage_SDB: 240
    pluie:
      Eclairage_SDB: 240
    nuit:
      Eclairage_SDB: 220

  DETENTE_SDB:
    # Mode bain long ou relaxation — ambiance reposante
    soleil:
      Eclairage_SDB: 60
    sombre:
      Eclairage_SDB: 80
    pluie:
      Eclairage_SDB: 80
    nuit:
      Eclairage_SDB: 60

  # ════════════════════════════════════════════
  # TRANSIT COULOIR
  # ════════════════════════════════════════════

  TRANSIT_COULOIR:
    soleil:
      Eclairage_Couloir: 80
    sombre:
      Eclairage_Couloir: 100
    pluie:
      Eclairage_Couloir: 100
    nuit:
      Eclairage_Couloir: 30