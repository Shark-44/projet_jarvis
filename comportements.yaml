# comportements.yaml — v4.0
# ══════════════════════════════════════════════════════════════════
#
# Table d'application : état GEMMA × condition environnementale locale → actionneurs
#
# Consommé par : moteur_scoring.py v2.0
# Produit par  : moteur_gemma.py v3.0   (un état par personne présente)
#
# Clés environnementales issues des capteurs physiques de jarvis_vectors :
#   nuit   — sun.sun = below_horizon (Priorité absolue, lux/pluie ignorés)
#   pluie  — Vérifié en temps réel par le capteur extérieur (Priorité 2)
#   sombre — Ciel couvert / faible luminosité détecté par le luxmètre
#   soleil — Temps clair et lumineux (Pas besoin de compensation forcée)
#
# Valeurs actionneurs :
#   0        — éteint (turn_off)
#   1 … 255  — allumé à cette luminosité (turn_on brightness=N)
#   true/false — switch on/off (Interrupteur_Eclairage_Cuisine)
#
# Échelle de référence :
#   0   = éteint
#   20  = veilleuse / orientation nocturne
#   60  = ambiance douce / fond
#   120 = confort lecture / repas
#   180 = travail / cuisine active
#   255 = maximum / entretien
#
# L'état ABSENT n'est plus traité ici : il est intercepté directement
# par le code Python pour un "turn_off" général instantané.
# ══════════════════════════════════════════════════════════════════

etats:
  # ════════════════════════════════════════════
  # CHAMBRE — sommeil / repos
  # ════════════════════════════════════════════

  SOMMEIL:
    # Obscurité totale demandée — l'environnement n'a aucun impact
    soleil:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0
    sombre:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0
    pluie:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0
    nuit:
      Eclairage_Chambre: 0
      Chevet_Chambre: 0

  LECTURE_LIT:
    # Sur le lit, actif — lumière douce côté chevet, compensation si sombre/pluie
    soleil:
      Eclairage_Chambre: 0
      Chevet_Chambre: 80
    sombre:
      Eclairage_Chambre: 40
      Chevet_Chambre: 120
    pluie:
      Eclairage_Chambre: 60
      Chevet_Chambre: 140
    nuit:
      Eclairage_Chambre: 0
      Chevet_Chambre: 80

  INSOMNIE:
    # Nuit longue active sur le lit — très tamisé pour préserver les yeux
    soleil:
      Eclairage_Chambre: 0
      Chevet_Chambre: 40
    sombre:
      Eclairage_Chambre: 0
      Chevet_Chambre: 40
    pluie:
      Eclairage_Chambre: 0
      Chevet_Chambre: 40
    nuit:
      Eclairage_Chambre: 0
      Chevet_Chambre: 40

  REVEIL_PHYSIOLOGIQUE:
    # Déplacement nocturne ou diurne court — orientation sans choc visuel
    soleil:
      Chevet_Chambre: 20
    sombre:
      Chevet_Chambre: 20
    pluie:
      Chevet_Chambre: 20
    nuit:
      Chevet_Chambre: 20

  REVEIL_ROUTINE:
    # Réveil du matin — montée progressive selon la clarté extérieure
    soleil:
      Eclairage_Chambre: 60
      Chevet_Chambre: 80
    sombre:
      Eclairage_Chambre: 100
      Chevet_Chambre: 120
    pluie:
      Eclairage_Chambre: 120
      Chevet_Chambre: 140
    nuit:
      Eclairage_Chambre: 60
      Chevet_Chambre: 80

  HABILLAGE:
    # Préparation hors du lit — lumière fonctionnelle adaptée
    soleil:
      Eclairage_Chambre: 120
      Chevet_Chambre: 0
    sombre:
      Eclairage_Chambre: 180
      Chevet_Chambre: 0
    pluie:
      Eclairage_Chambre: 200
      Chevet_Chambre: 0
    nuit:
      Eclairage_Chambre: 140
      Chevet_Chambre: 0

  ENTRETIEN_CHAMBRE:
    # Visibilité maximale requise pour entretien
    soleil:
      Eclairage_Chambre: 255
      Chevet_Chambre: 0
    sombre:
      Eclairage_Chambre: 255
      Chevet_Chambre: 0
    pluie:
      Eclairage_Chambre: 255
      Chevet_Chambre: 0
    nuit:
      Eclairage_Chambre: 255
      Chevet_Chambre: 0

  # ════════════════════════════════════════════
  # SALON — TV / musique / repas / social
  # ════════════════════════════════════════════

  REPOS_TV:
    # Ambiance cinéma — compensation légère si le ciel s'assombrit ou s'il pleut
    soleil:
      Eclairage_Salon_tv: 40
      Eclairage_Salon_table: 0
      Wled_Salon: 30
      Spot_Ambiance: 0
    sombre:
      Eclairage_Salon_tv: 60
      Eclairage_Salon_table: 20
      Wled_Salon: 50
      Spot_Ambiance: 30
    pluie:
      Eclairage_Salon_tv: 70
      Eclairage_Salon_table: 30
      Wled_Salon: 60
      Spot_Ambiance: 40
    nuit:
      Eclairage_Salon_tv: 50
      Eclairage_Salon_table: 0
      Wled_Salon: 40
      Spot_Ambiance: 20

  SOMMEIL_SALON:
    # Endormissement détecté devant la TV — extinction générale progressive
    soleil:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 0
      Wled_Salon: 0
      Spot_Ambiance: 0
    sombre:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 0
      Wled_Salon: 0
      Spot_Ambiance: 0
    pluie:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 0
      Wled_Salon: 0
      Spot_Ambiance: 0
    nuit:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 0
      Wled_Salon: 0
      Spot_Ambiance: 0

  REPOS_MUSIQUE:
    # Ambiance relaxante / cocooning renforcée en cas de pluie locale
    soleil:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 40
      Wled_Salon: 80
      Spot_Ambiance: 60
    sombre:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 60
      Wled_Salon: 100
      Spot_Ambiance: 80
    pluie:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 70
      Wled_Salon: 120
      Spot_Ambiance: 90
    nuit:
      Eclairage_Salon_tv: 0
      Eclairage_Salon_table: 40
      Wled_Salon: 100
      Spot_Ambiance: 80

  SALON_REPAS:
    # Table à manger active + retour lumineux vers la cuisine
    soleil:
      Eclairage_Salon_table: 120
      Eclairage_Salon_tv: 0
      Wled_Salon: 40
      Interrupteur_Eclairage_Cuisine: true
    sombre:
      Eclairage_Salon_table: 160
      Eclairage_Salon_tv: 0
      Wled_Salon: 60
      Interrupteur_Eclairage_Cuisine: true
    pluie:
      Eclairage_Salon_table: 180
      Eclairage_Salon_tv: 0
      Wled_Salon: 70
      Interrupteur_Eclairage_Cuisine: true
    nuit:
      Eclairage_Salon_table: 140
      Eclairage_Salon_tv: 0
      Wled_Salon: 50
      Interrupteur_Eclairage_Cuisine: true

  ECHANGE_SOCIAL:
    # Présence de plusieurs humains — espace de vie bien éclairé et chaleureux
    soleil:
      Eclairage_Salon_tv: 60
      Eclairage_Salon_table: 100
      Wled_Salon: 80
      Spot_Ambiance: 60
    sombre:
      Eclairage_Salon_tv: 80
      Eclairage_Salon_table: 140
      Wled_Salon: 100
      Spot_Ambiance: 80
    pluie:
      Eclairage_Salon_tv: 90
      Eclairage_Salon_table: 160
      Wled_Salon: 120
      Spot_Ambiance: 90
    nuit:
      Eclairage_Salon_tv: 60
      Eclairage_Salon_table: 120
      Wled_Salon: 100
      Spot_Ambiance: 80

  ENTRETIEN_SALON:
    # Mode nettoyage général à pleine puissance
    soleil:
      Eclairage_Salon_tv: 255
      Eclairage_Salon_table: 255
      Wled_Salon: 0
      Spot_Ambiance: 0
    sombre:
      Eclairage_Salon_tv: 255
      Eclairage_Salon_table: 255
      Wled_Salon: 0
      Spot_Ambiance: 0
    pluie:
      Eclairage_Salon_tv: 255
      Eclairage_Salon_table: 255
      Wled_Salon: 0
      Spot_Ambiance: 0
    nuit:
      Eclairage_Salon_tv: 255
      Eclairage_Salon_table: 255
      Wled_Salon: 0
      Spot_Ambiance: 0

  # ════════════════════════════════════════════
  # BUREAU — travail / lecture / entretien
  # ════════════════════════════════════════════

  ACTIF_BUREAU:
    # Écrans et plan de travail — le luxmètre extérieur ajuste finement la puissance
    soleil:
      Eclairage_bureau: 160
      Spot_bureau: 100
    sombre:
      Eclairage_bureau: 200
      Spot_bureau: 140
    pluie:
      Eclairage_bureau: 220
      Spot_bureau: 160
    nuit:
      Eclairage_bureau: 180
      Spot_bureau: 120

  LECTURE_BUREAU:
    # Concentration sur papier — éclairage doux ciblé
    soleil:
      Eclairage_bureau: 80
      Spot_bureau: 60
    sombre:
      Eclairage_bureau: 120
      Spot_bureau: 100
    pluie:
      Eclairage_bureau: 140
      Spot_bureau: 120
    nuit:
      Eclairage_bureau: 100
      Spot_bureau: 80

  ENTRETIEN_BUREAU:
    soleil:
      Eclairage_bureau: 255
      Spot_bureau: 255
    sombre:
      Eclairage_bureau: 255
      Spot_bureau: 255
    pluie:
      Eclairage_bureau: 255
      Spot_bureau: 255
    nuit:
      Eclairage_bureau: 255
      Spot_bureau: 255

  # ════════════════════════════════════════════
  # CUISINE — snack / activité
  # ════════════════════════════════════════════

  CUISINE_SNACK:
    # Passage express (boire un verre, ouvrir le frigo)
    soleil:
      Interrupteur_Eclairage_Cuisine: false
    sombre:
      Interrupteur_Eclairage_Cuisine: true
    pluie:
      Interrupteur_Eclairage_Cuisine: true
    nuit:
      Interrupteur_Eclairage_Cuisine: true

  CUISINE_ACTIVITE:
    # Préparation d'un repas — éclaire la cuisine et ajoute un fond sur la table à manger
    soleil:
      Interrupteur_Eclairage_Cuisine: false
      Eclairage_Salon_table: 0
    sombre:
      Interrupteur_Eclairage_Cuisine: true
      Eclairage_Salon_table: 40
    pluie:
      Interrupteur_Eclairage_Cuisine: true
      Eclairage_Salon_table: 60
    nuit:
      Interrupteur_Eclairage_Cuisine: true
      Eclairage_Salon_table: 40

  # ════════════════════════════════════════════
