# index_repository.py
import appdaemon.plugins.hass.hassapi as hass
import yaml

class IndexRepository(hass.Hass):
    def __init__(self, *args, **kwargs):
        super().__init__(*args, **kwargs)
        self._path = "/homeassistant/index.yaml"

    def initialize(self):
        pass

    def _load(self):
        with open(self._path, "r") as f:
            return yaml.safe_load(f)

    def get_actionneur(self, room, id_name):
        index = self._load()
        for device in index["pieces"][room]["actionneurs"]:
            if device["id"] == id_name:
                return device["entity"]
        return None

    def get_recepteur(self, room, id_name):
        index = self._load()
        for device in index["pieces"][room]["recepteurs"]:
            if device["id"] == id_name:
                return device["entity"]
        return None

    def get_appareil(self, id_name):
        index = self._load()
        for device in index["pieces"]["Materiel_mobile"]["appareils"]:
            if device["id"] == id_name:
                return device["entity"]
        return None