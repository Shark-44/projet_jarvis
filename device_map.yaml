pieces:
  chambre:
    recepteurs:
      - device: CapteurMvtChambre
        id: Presence_chambre

        # ── Sorties binaires directes ──────────────────────────────
        sorties:
          presence_piece:  binary_sensor.capteur_mvt_chambre_presence
          sur_le_lit:      binary_sensor.capteur_mvt_chambre_presence_lit
          passage_porte:   binary_sensor.capteur_mvt_chambre_presence_porte

        # ── Vecteurs bruts — transmis au moteur vectoriel ──────────
        # Le moteur vectoriel consomme ces données pour produire
        # des grandeurs temporelles (dérive position, tendance vitesse)
        vecteurs:
          nb_cibles:         sensor.capteur_mvt_chambre_nombre_de_cibles
          cible_1_vitesse:   sensor.capteur_mvt_chambre_cible_1_vitesse
          cible_1_direction: text_sensor.capteur_mvt_chambre_cible_1_direction
          cible_2_vitesse:   sensor.capteur_mvt_chambre_cible_2_vitesse
          cible_2_direction: text_sensor.capteur_mvt_chambre_cible_2_direction
          cible_3_vitesse:   sensor.capteur_mvt_chambre_cible_3_vitesse
          cible_3_direction: text_sensor.capteur_mvt_chambre_cible_3_direction
          # cible_1_distance: sensor.capteur_mvt_chambre_cible_1_distance  # à venir ESPHome
          # cible_2_distance: sensor.capteur_mvt_chambre_cible_2_distance
          # cible_3_distance: sensor.capteur_mvt_chambre_cible_3_distance

        # ── Seuils — appliqués par device_map_reader ───────────────
        seuils:
          vitesse_zone_morte: 0.10    # m/s — en dessous = immobile (respiration, micro-mvt)

        # ── Sorties dérivées — calculées par device_map_reader ─────
        # Basées sur snapshot instantané uniquement
        # Les calculs temporels (dérive, intégrale) → moteur vectoriel
        sorties_derivees:
          immobile: bool    # toutes cibles actives dans zone morte vitesse

  bureau:
    recepteurs:
      - device: CapteurMvtBureau
        id: Presence_bureau
        sorties:
          presence_piece:  binary_sensor.capteur_mvt_bureau_presence
          sur_cliclac:     binary_sensor.capteur_mvt_bureau_presence_cliclac
          passage_porte:   binary_sensor.capteur_mvt_bureau_presence_porte
        vecteurs:
          nb_cibles:         sensor.capteur_mvt_bureau_nombre_de_cibles
          cible_1_vitesse:   sensor.capteur_mvt_bureau_cible_1_vitesse
          cible_1_direction: text_sensor.capteur_mvt_bureau_cible_1_direction
          cible_2_vitesse:   sensor.capteur_mvt_bureau_cible_2_vitesse
          cible_2_direction: text_sensor.capteur_mvt_bureau_cible_2_direction
          cible_3_vitesse:   sensor.capteur_mvt_bureau_cible_3_vitesse
          cible_3_direction: text_sensor.capteur_mvt_bureau_cible_3_direction
        seuils:
          vitesse_zone_morte: 0.10    # m/s — en dessous = immobile
        sorties_derivees:
          immobile: bool    # toutes cibles actives dans zone morte vitesse

  exterieur:
    recepteurs:
      - device: CapteurExterieur
        id: Meteo_locale
        mesures:
          lumiere_mv: sensor.capteur_ext_lumiere
          pluie_mv:   sensor.capteur_ext_pluie
        seuils:
          lux_conversion:  0.02276  # mV → lux
          lux_seuil:       50       # lux — seuil besoin lumière
          lux_hysterese:   10       # ±10 lux → zone morte 40-60 lux
          pluie_seuil_mv:  200      # mV → au-dessus = il pleut
        sorties:
          pleut:          bool      # pluie_mv > pluie_seuil_mv
          besoin_lumiere: bool      # lux < seuil (avec hystérésis)

  salon:
    recepteurs:
      - device: Television
        id: Tele
        sorties:
          allumee:    media_player.65pus7304_12_2    # on/off direct
        mesures:
          etat_raw:   media_player.65pus7304_12_3    # playing/paused/idle
        seuils:
          valeur_active: "playing"
          valeur_pause:  "paused"
        sorties_derivees:
          en_lecture: bool    # etat_raw == valeur_active
          en_pause:   bool    # etat_raw == valeur_pause
