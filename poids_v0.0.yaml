# Poids des signaux pour le moteur GEMMA
# Chaque signal contribue au score d'un état.
# Valeur entre 0.0 et 1.0 — plus c'est élevé, plus le signal compte.
# Seuil de déclenchement : score > 0.75 → état confirmé.

# ─────────────────────────────────────────────
# Modificateurs contextuels (heure de la journée)
# ─────────────────────────────────────────────
contexte:
  nuit:        # 23h → 7h
    debut: 23
    fin: 7
    modificateur: 1.3   # amplifie les signaux de sommeil
  soiree:      # 20h → 23h
    debut: 20
    fin: 23
    modificateur: 1.1
  journee:     # 7h → 20h
    debut: 7
    fin: 20
    modificateur: 1.0

# ─────────────────────────────────────────────
# Seuil global de décision
# ─────────────────────────────────────────────
seuil: 0.75

# ─────────────────────────────────────────────
# États et leurs signaux contributeurs
# ─────────────────────────────────────────────
etats:

  ABSENT:
    description: Personne à la maison
    signaux:
      Capteur_presence_bureau:     { poids: 0.9, valeur_active: false }
      Capteur presence cuisine:    { poids: 0.9, valeur_active: false }
      Capteur Porte d'entrée:      { poids: 0.7, valeur_active: false }
      Ampli:                       { poids: 0.5, valeur_active: false }
      Tele:                        { poids: 0.5, valeur_active: "off" }

  SOMMEIL:
    description: Humain en train de dormir
    signaux:
      Tele:                        { poids: 0.9, valeur_active: "off" }
      Ampli:                       { poids: 0.8, valeur_active: false }
      PC_HP:                       { poids: 0.7, valeur_active: "off" }
      Capteur_presence_bureau:     { poids: 0.6, valeur_active: false }
      Capteur luminosité:          { poids: 0.4, seuil_max: 5 }       # lux très bas

  REPOS_TV:
    description: Humain devant la télévision
    signaux:
      Tele:                        { poids: 0.95, valeur_active: "playing" }
      Ampli:                       { poids: 0.5,  valeur_active: true }
      Capteur luminosité:          { poids: 0.3,  seuil_max: 80 }     # lumière tamisée

  REPOS_MUSIQUE:
    description: Humain qui écoute de la musique
    signaux:
      Ampli:                       { poids: 0.95, valeur_active: true }
      Tele:                        { poids: 0.8,  valeur_active: "off" }
      PC_HP:                       { poids: 0.4,  valeur_active: "off" }

  NUTRITIF:
    description: Humain en cuisine
    signaux:
      Capteur presence cuisine:    { poids: 0.95, valeur_active: true }
      Interrupteur Eclairage Cuisine: { poids: 0.6, valeur_active: true }
      Tele:                        { poids: 0.3,  valeur_active: "off" }

  ENTRETIEN:
    description: Humain en ménage ou réparation
    signaux:
      Capteur luminosité:          { poids: 0.5,  seuil_min: 100 }    # lumière forte
      Capteur_presence_bureau:     { poids: 0.4,  valeur_active: true }
      Capteur presence cuisine:    { poids: 0.4,  valeur_active: true }
      Tele:                        { poids: 0.6,  valeur_active: "off" }
      Ampli:                       { poids: 0.5,  valeur_active: false }

  ACTIF_BUREAU:
    description: Humain travaillant au bureau
    signaux:
      PC_HP:                       { poids: 0.95, valeur_active: "on" }
      Capteur_presence_bureau:     { poids: 0.8,  valeur_active: true }
      Tele:                        { poids: 0.6,  valeur_active: "off" }
      Ampli:                       { poids: 0.3,  valeur_active: false }
